<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>PocketWise · 省省账</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #faf9f7;
        color: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "PingFang SC", "Helvetica Neue",
          Arial, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #0d9488;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: #78716c;
        margin: 0;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 0.75rem;
        border: none;
        border-radius: 12px;
        background: #0d9488;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 500;
        padding: 0.65rem 1.25rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #121212;
          color: #f5f5f4;
        }
        p {
          color: #a8a29e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">省</div>
      <h1>You're offline</h1>
      <p>PocketWise needs a connection to load your latest data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
